##########################################################################
# One Nginx, two single-page apps (see the repo-root Dockerfile):
#
#   /             landing page   (landing/dist)
#   /app/         gym dashboard  (frontend/dist, built with base: "/app/")
#   /privacidad   legal pages    (landing/public/*.html, no extension needed)
##########################################################################
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed build files from either app can be cached forever: the
    # filename changes whenever the content changes, so a new deploy is picked
    # up automatically without ever serving a stale asset. This is a regex
    # location so it also covers /app/assets/ without the block below stealing
    # it (regex locations are matched before prefix locations).
    location ~ ^/(app/)?assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Both HTML shells must always be revalidated. Otherwise a browser keeps a
    # cached index.html pointing at an old (deleted) bundle after a deploy, the
    # script 404s, and the app never mounts ("Cargando React..." stays up).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /app/index.html {
        add_header Cache-Control "no-cache";
    }

    # /app without the trailing slash would otherwise fall through to the
    # landing page's location block below.
    location = /app {
        return 301 /app/;
    }

    # Dashboard SPA. It needs its own fallback: a refresh on any /app/... URL
    # must return the dashboard shell, never the landing page.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # Landing SPA. The $uri.html probe is what serves landing/public/
    # privacidad.html at the clean URL /privacidad (and /terminos likewise).
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
